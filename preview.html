<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Español · 单词记忆小屋</title>
<style>
:root {
  --bg:#fff8f3; --card:#ffffff; --ink:#4d4650; --muted:#8d8490;
  --pink:#ffd9e7; --blue:#d9efff; --yellow:#fff0bd; --green:#dff6e8;
  --purple:#e8ddff; --shadow:0 16px 45px rgba(91,73,91,.12);
  --shadow2:0 8px 22px rgba(91,73,91,.10); --radius:28px;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:
 radial-gradient(circle at 8% 12%,#ffe8f0 0 7%,transparent 24%),
 radial-gradient(circle at 92% 8%,#e4f5ff 0 8%,transparent 25%),
 linear-gradient(135deg,#fffaf6,#f8f4ff 55%,#f5fbff);
 color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
button,textarea{font:inherit}
.app{width:80vw;min-height:94vh;margin:3vh auto;display:flex;flex-direction:column;gap:16px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:54px;height:54px;border-radius:18px;background:var(--yellow);display:grid;place-items:center;font-size:28px;box-shadow:var(--shadow2);transform:rotate(-3deg)}
.brand h1{margin:0;font-size:23px} .brand small{color:var(--muted)}
.tabs{display:flex;gap:8px;padding:7px;background:#fff9;border:1px solid #fff;border-radius:22px;box-shadow:var(--shadow2)}
.tab{border:0;background:transparent;color:var(--muted);padding:10px 16px;border-radius:16px;cursor:pointer;font-weight:700;transition:.2s}
.tab:hover{transform:translateY(-2px);background:#fff}
.tab.active{background:var(--purple);color:#574a78}
.score{min-width:130px;padding:10px 16px;border-radius:20px;background:#fff;box-shadow:var(--shadow2);text-align:center}
.score b{font-size:22px;color:#705d8e;display:inline-block}
.score.bump b{animation:bump .45s ease}
@keyframes bump{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-10px) scale(1.25)}100%{transform:translateY(0) scale(1)}}
.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 180px;gap:18px;flex:1;align-items:stretch}
.panel,.card{background:#fffffff2;border:1px solid #fff;box-shadow:var(--shadow);border-radius:var(--radius);backdrop-filter:blur(8px)}
.notes{padding:18px;display:flex;flex-direction:column;min-height:650px}
.notes h2,.motivation h2{font-size:16px;margin:0 0 10px}
.notes textarea{flex:1;min-height:480px;resize:none;border:0;outline:0;background:#fff8c9aa;border-radius:20px;padding:15px;line-height:1.7;color:#62585f;box-shadow:inset 0 1px 4px #bcae7130}
.export{margin-top:10px;border:0;border-radius:16px;padding:11px;background:var(--blue);cursor:pointer;font-weight:700;transition:.2s}
.export:hover{transform:translateY(-2px)}
.motivation{padding:18px;height:max-content;position:sticky;top:15px}
.sticker{font-size:44px;text-align:center;margin:6px 0 12px}
.achievement{background:var(--green);padding:12px;border-radius:17px;line-height:1.5;font-size:13px}
.progress{margin-top:12px;background:#f6efff;border-radius:17px;padding:12px;font-size:13px}
.bar{height:8px;background:#fff;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:#bca9e9;border-radius:99px;transition:width .4s}
.center{display:flex;justify-content:center;align-items:center;min-width:0}
.card{width:100%;max-width:850px;min-height:650px;padding:28px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:#ffe7f0;right:-65px;top:-65px}
.card:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:#e6f4ff;left:-50px;bottom:-45px}
.imageBox{height:150px;border-radius:24px;background:#f7f3ff;display:grid;place-items:center;overflow:hidden;margin-bottom:18px}
.imageBox img{width:100%;height:100%;object-fit:cover}
.wordline{display:flex;align-items:center;justify-content:center;gap:12px;position:relative;z-index:1}
.word{font-size:42px;font-weight:900;letter-spacing:.2px;color:#5d5265;text-align:center;word-break:break-word}
.speaker{width:46px;height:46px;border:0;border-radius:50%;background:var(--pink);cursor:pointer;font-size:22px;transition:.2s}
.speaker:hover{transform:scale(1.08) rotate(-4deg)}
.phonetic{text-align:center;color:#9a8e9b;margin:6px 0 16px}
.example{background:#f9f7ff;border-radius:22px;padding:15px 18px;display:flex;align-items:center;gap:10px;margin-bottom:18px}
.example p{margin:0;line-height:1.6;flex:1}
.example strong{color:#8067a5}
.options{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.option{border:2px solid transparent;background:#fff5f8;padding:14px;border-radius:18px;cursor:pointer;text-align:left;transition:.2s;min-height:58px}
.option:hover{transform:translateY(-2px);box-shadow:var(--shadow2)}
.option.correct{border-color:#75c995;background:#edfff3}
.option.wrong{border-color:#ee8c9f;background:#fff0f2}
.option.disabled{cursor:default}
.actions{display:flex;gap:10px;margin-top:15px}
.action{flex:1;border:0;border-radius:17px;padding:11px;cursor:pointer;font-weight:800;transition:.2s}
.action:hover{transform:translateY(-2px)}
.fuzzy{background:var(--yellow)} .unknown{background:var(--pink)}
.explain{margin-top:15px;padding:16px;border-radius:20px;background:#eef7ff;display:none;line-height:1.65;position:relative;z-index:2}
.explain.show{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.root{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.chip{padding:5px 9px;border-radius:12px;background:#fff;border:1px solid #eee;color:#75677d;font-size:12px}
.next{margin-top:15px;width:100%;border:0;border-radius:18px;padding:13px;background:var(--purple);cursor:pointer;font-weight:900;display:none}
.empty{height:100%;min-height:600px;display:grid;place-items:center;text-align:center;padding:40px}
.empty .big{font-size:65px}
.modal{position:fixed;inset:0;background:#54465a55;display:none;place-items:center;z-index:20}
.modal.show{display:grid}
.pop{background:#fff;border-radius:30px;padding:30px;text-align:center;box-shadow:0 25px 80px #44384b35;animation:pop .3s ease;max-width:360px}
@keyframes pop{from{transform:scale(.7) rotate(-4deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
.pop .emoji{font-size:55px} .pop h3{margin:8px 0;font-size:25px}
@media(max-width:1050px){.layout{grid-template-columns:180px minmax(0,1fr)}.motivation{display:none}}
@media(max-width:760px){.app{width:94vw}.layout{grid-template-columns:1fr}.notes{min-height:260px}.notes textarea{min-height:170px}.card{min-height:auto;padding:18px}.options{grid-template-columns:1fr}.word{font-size:34px}.imageBox{height:120px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">📚</div><div><h1>Español · 单词记忆小屋</h1><small>每天一点点，把单词变成自己的。</small></div></div>
    <nav class="tabs">
      <button class="tab active" data-pool="new">🌱 学新词</button>
      <button class="tab" data-pool="fuzzy">🌼 复习模糊词</button>
      <button class="tab" data-pool="error">🧸 复习错误</button>
    </nav>
    <div class="score">⭐ 总积分 <b id="score">0</b></div>
  </header>

  <main class="layout">
    <aside class="panel notes">
      <h2>📝 我的笔记</h2>
      <textarea id="notes" placeholder="在这里写例句、联想、易错点……"></textarea>
      <button class="export" id="export">⇩ 导出 TXT</button>
    </aside>

    <section class="center" id="main"></section>

    <aside class="panel motivation">
      <h2>🎀 学习激励</h2>
      <div class="sticker" id="sticker">🌸</div>
      <div class="achievement" id="achievement">开始学习吧！每答对一个词，都离熟练更近一步。</div>
      <div class="progress">
        <div>今日进度：<b id="today">0</b></div>
        <div class="bar"><i id="bar"></i></div>
        <div style="margin-top:8px;color:#8d8490">到期复习：<b id="due">0</b></div>
      </div>
    </aside>
  </main>
</div>

<div class="modal" id="modal"><div class="pop"><div class="emoji" id="modalEmoji">🎉</div><h3 id="modalTitle">太棒啦！</h3><p id="modalText">继续保持！</p></div></div>

const STORAGE = {
  progress: "es_vocab_progress_v1",
  score: "es_vocab_score_v1",
  notes: "es_vocab_notes_v1",
  daily: "es_vocab_daily_v1"
};
const INTERVALS = [0,1,2,4,7,15,30,60];

function load(key, fallback) {
  try { const x=localStorage.getItem(key); return x===null?fallback:JSON.parse(x); }
  catch(e) { return fallback; }
}
function save(key,val) { localStorage.setItem(key,JSON.stringify(val)); }

let progress=load(STORAGE.progress,{});
let score=load(STORAGE.score,0);
let notes=localStorage.getItem(STORAGE.notes)||"";
let daily=load(STORAGE.daily,{date:"",count:0});
let pool="new";
let current=null;
let answered=false;

const $=s=>document.querySelector(s);
$("#score").textContent=score;
$("#notes").value=notes;

function todayKey(){return new Date().toISOString().slice(0,10)}
if(daily.date!==todayKey()){daily={date:todayKey(),count:0};save(STORAGE.daily,daily)}
$("#today").textContent=daily.count;

function normalize(w){
  return w.toLowerCase()
    .replace(/\([^)]*\)/g,"").replace(/,\s*(la|el|los|las)$/,"")
    .replace(/á/g,"a").replace(/é/g,"e").replace(/í/g,"i").replace(/ó/g,"o").replace(/ú/g,"u")
    .replace(/[¿?¡!.,;:]/g,"").trim();
}
function rootKey(w){
  let s=normalize(w).replace(/\s+/g,"");
  s=s.replace(/(mente|ción|sión|ando|iendo|ado|ido|able|al|ar|er|ir|es|as|os|a|o)$/,"");
  return s.slice(0,Math.max(4,Math.min(7,s.length)));
}

const words=VOCAB.map((v,i)=>({
  id:i, word:v[0], correctMeaning:v[1],
  wrongMeanings:[], sentence:"", translation:"", imageUrl:"",
  rootWords:[], knowledge:"", analysis:""
}));

const rootMap={};
words.forEach(w=>{
  const k=rootKey(w.word); (rootMap[k] ||= []).push(w);
});
words.forEach(w=>{
  const group=rootMap[rootKey(w.word)]||[];
  w.rootWords=group.filter(x=>x.id!==w.id).slice(0,6).map(x=>x.word);
  w.knowledge=w.rootWords.length
    ? `词根联想：${w.rootWords.join("、")}。可以把这些词放在同一组里反复记忆。`
    : `用例句和固定搭配一起记忆“${w.word}”，比只记中文释义更牢固。`;
  w.analysis=`${w.word} 的核心意思是“${w.correctMeaning}”。答题后尝试用它自己造一个西语句子。`;
  const isPhrase=w.word.includes(" ");
  w.sentence=(isPhrase?`Hoy practicamos la expresión «${w.word}» en clase.`:`Hoy practicamos la palabra «${w.word}» en clase.`);
  w.translation=(isPhrase?`今天我们在课堂上练习“${w.word}”这个表达。`:`今天我们在课堂上练习“${w.word}”这个词。`);
  w.imageUrl=makeImage(w.word);
});

function makeImage(word){
  const safe=word.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").slice(0,24);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
    <defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#ffe5ef"/><stop offset="1" stop-color="#e5f4ff"/></linearGradient></defs>
    <rect width="900" height="360" rx="40" fill="url(#g)"/>
    <circle cx="130" cy="115" r="58" fill="#fff5bd"/><circle cx="770" cy="250" r="72" fill="#e5ddff"/>
    <path d="M110 145 Q130 185 150 145" fill="none" stroke="#8b7b91" stroke-width="8" stroke-linecap="round"/>
    <circle cx="110" cy="112" r="7" fill="#8b7b91"/><circle cx="150" cy="112" r="7" fill="#8b7b91"/>
    <text x="450" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="48" font-weight="800" fill="#66586d">${safe}</text>
    <text x="450" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#8d8192">Español · aprender jugando</text>
  </svg>`;
  return "data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg);
}

function defaultState(){return {state:"new",level:0,last:0,due:0,correct:0,wrong:0}}
function st(id){return progress[id] || (progress[id]=defaultState())}
function isDue(x){return !x.due || x.due<=Date.now()}
function dueCount(){return words.filter(w=>isDue(st(w.id)) && st(w.id).state==="familiar").length}
function poolWords(){
  if(pool==="fuzzy") return words.filter(w=>st(w.id).state==="fuzzy" && isDue(st(w.id)));
  if(pool==="error") return words.filter(w=>st(w.id).state==="error" && isDue(st(w.id)));
  const fresh=words.filter(w=>st(w.id).state==="new");
  if(fresh.length) return fresh;
  return words.filter(w=>st(w.id).state==="familiar" && isDue(st(w.id)));
}
function shuffled(arr){return [...arr].sort(()=>Math.random()-.5)}
function optionsFor(w){
  const others=shuffled(words.filter(x=>x.id!==w.id && x.correctMeaning!==w.correctMeaning))
    .slice(0,3).map(x=>x.correctMeaning);
  return shuffled([w.correctMeaning,...others]);
}

function render(){
  updateStats();
  const list=poolWords();
  if(!list.length){
    $("#main").innerHTML=`<div class="card empty"><div><div class="big">🌈</div>
      <h2>${pool==="new"?"今天的新词学完啦！":pool==="fuzzy"?"模糊词暂时没有到期复习。":"错误词暂时没有到期复习。"}</h2>
      <p>可以切换到其他词库继续学习。</p></div></div>`;
    current=null; return;
  }
  current=list[Math.floor(Math.random()*list.length)];
  answered=false;
  const w=current;
  const opts=optionsFor(w);
  const target=htmlEscape(w.word);
  const sentence=htmlEscape(w.sentence).replace(target,`<strong>${target}</strong>`);
  const root=w.rootWords.length ? `<div class="root">${w.rootWords.map(x=>`<span class="chip">${htmlEscape(x)}</span>`).join("")}</div>` : `<div class="root"><span class="chip">暂无同词根词</span></div>`;
  $("#main").innerHTML=`<div class="card">
    <div class="imageBox"><img src="${w.imageUrl}" alt="单词配图"></div>
    <div class="wordline"><div class="word">${target}</div><button class="speaker" id="speakWord" title="播放西语发音">🔊</button></div>
    <div class="phonetic">${pool==="new"?"新词 / 到期熟悉词":pool==="fuzzy"?"模糊复习":"错误复习"} · 记忆等级 ${st(w.id).level}</div>
    <div class="example"><p>${sentence}<br><span style="color:#8f8791">${htmlEscape(w.translation)}</span></p><button class="speaker" id="speakSentence" title="播放例句">🔊</button></div>
    <div class="options" id="options">${opts.map((o,i)=>`<button class="option" data-meaning="${encodeURIComponent(o)}">${htmlEscape(o)}</button>`).join("")}</div>
    <div class="actions"><button class="action fuzzy" id="fuzzy">🌼 模糊</button><button class="action unknown" id="unknown">🧸 不认识</button></div>
    <div class="explain" id="explain"><b>📖 解析：</b>${htmlEscape(w.analysis)}<br><b>🌱 词根/拓展：</b>${htmlEscape(w.knowledge)}${root}</div>
    <button class="next" id="next">继续下一个 →</button>
  </div>`;
  $("#speakWord").onclick=()=>speak(w.word);
  $("#speakSentence").onclick=()=>speak(w.sentence);
  document.querySelectorAll(".option").forEach(btn=>btn.onclick=()=>answer(decodeURIComponent(btn.dataset.meaning),btn));
  $("#fuzzy").onclick=()=>moveTo("fuzzy");
  $("#unknown").onclick=()=>moveTo("error");
  $("#next").onclick=render;
  setTimeout(()=>speak(w.word),250);
}

function answer(value,btn){
  if(answered)return;
  answered=true;
  const w=current, p=st(w.id), correct=value===w.correctMeaning;
  document.querySelectorAll(".option").forEach(b=>{
    b.classList.add("disabled");
    if(decodeURIComponent(b.dataset.meaning)===w.correctMeaning)b.classList.add("correct");
  });
  if(correct){
    btn.classList.add("correct"); p.correct++; p.level=Math.min(p.level+1,INTERVALS.length-1);
    p.state="familiar"; p.last=Date.now(); p.due=Date.now()+INTERVALS[p.level]*86400000;
    const gain=pool==="new"?10:pool==="fuzzy"?5:3;
    addScore(gain); daily.count++; save(STORAGE.daily,daily); showPraise(gain);
  } else {
    btn.classList.add("wrong"); p.wrong++; p.last=Date.now();
    p.due=Date.now()+6*60*60*1000;
  }
  save(STORAGE.progress,progress);
  $("#explain").classList.add("show"); $("#next").style.display="block";
  updateStats();
}

function moveTo(state){
  if(!current)return;
  const p=st(current.id); p.state=state; p.last=Date.now(); p.due=Date.now();
  save(STORAGE.progress,progress); render();
}

function addScore(n){
  score+=n; save(STORAGE.score,score);
  $("#score").textContent=score;
  $("#score").parentElement.classList.remove("bump"); void $("#score").offsetWidth;
  $("#score").parentElement.classList.add("bump");
  const thresholds=[50,100,200,500,1000];
  const hit=thresholds.find(t=>score>=t && score-n<t);
  if(hit) showPraise(0,hit);
}

function showPraise(gain=0,threshold=0){
  const texts=[
    ["🎉","太棒啦！","答对了，继续保持！"],
    ["✨","厉害！","这一词已经成功收入熟悉库。"],
    ["🌸","稳稳拿下！","再来一个，记忆会越来越牢。"],
    ["🧁","做得很好！","坚持一点点，词汇量就会一点点长大。"]
  ];
  const t=texts[Math.floor(Math.random()*texts.length)];
  $("#modalEmoji").textContent=t[0]; $("#modalTitle").textContent=threshold?`${threshold} 分达成！`:t[1];
  $("#modalText").textContent=gain?`${t[2]} +${gain} 分`:t[2];
  $("#modal").classList.add("show"); setTimeout(()=>$("#modal").classList.remove("show"),1200);
}

function speak(text){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang="es-ES"; u.rate=.88; u.pitch=1.02; u.volume=.85;
  speechSynthesis.speak(u);
}

function successSound(){
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
    const ctx=new C(), now=ctx.currentTime;
    [523.25,659.25,783.99].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,now+i*.08);
      g.gain.exponentialRampToValueAtTime(.12,now+i*.08+.02);
      g.gain.exponentialRampToValueAtTime(.0001,now+i*.08+.22);
      o.connect(g);g.connect(ctx.destination);o.start(now+i*.08);o.stop(now+i*.08+.24);
    });
  }catch(e){}
}

function htmlEscape(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function updateStats(){
  $("#score").textContent=score; $("#today").textContent=daily.count;
  const due=dueCount(); $("#due").textContent=due;
  const total=words.length, familiar=words.filter(w=>st(w.id).state==="familiar").length;
  $("#bar").style.width=Math.min(100,familiar/total*100)+"%";
  $("#achievement").textContent=score>=200?"🏆 词汇小达人：200+ 分！":score>=100?"🌟 已经超过 100 分啦！":score>=50?"🎈 50 分成就解锁！":"每答对一个词，都会积累一点成就感。";
}

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active")); b.classList.add("active");
  pool=b.dataset.pool; render();
});

$("#notes").addEventListener("input",e=>localStorage.setItem(STORAGE.notes,e.target.value));
$("#export").onclick=()=>{
  const blob=new Blob([$("#notes").value],{type:"text/plain;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="我的西语学习笔记.txt";a.click();URL.revokeObjectURL(a.href);
};
$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.remove("show")};

const originalAnswer=answer;
answer=function(value,btn){const before=answered; originalAnswer(value,btn); if(!before && value===current.correctMeaning) successSound();};
render();
</script>
</body>
